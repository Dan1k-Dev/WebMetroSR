<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация о контейнере</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body class="container-info-page">
    <div class="container">
        <div class="container-header">
            <h2>
                📁 Контейнер: <span id="containerName">загрузка...</span>
                <span class="badge" id="hostCountBadge">загрузка...</span>
            </h2>
        </div>

        <div class="status-bar">
            <div class="progress" id="progressIndicator">
                <div class="spinner"></div>
                <span id="progressText">Получение списка хостов...</span>
            </div>
            <div style="display: flex; gap: 12px;">
                <label for="searchInput" class="sr-only">Поиск по таблице хостов</label>
                <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск (hostname, статус, HDD...)" disabled>
                <button id="exportBtn" class="export-btn" disabled>📎 Экспорт в Excel</button>
            </div>
        </div>

        <div class="table-container">
            <table id="hostsTable">
                <thead>
                    <tr>
                        <th>Hostname</th>
                        <th>Статус и информация</th>
                        <th>HDD Total</th>
                        <th>HDD Free</th>
                        <th>RAM</th>
                        <th>OS Info</th>
                    </tr>
                </thead>
                <tbody id="hostsTableBody">
                    <tr><td colspan="6">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const containerName = urlParams.get('name');
        const containerDn = urlParams.get('dn');

        let abortController = null;
        let isDataLoaded = false;
        let batchCorrelationId = null;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function safeText(text) {
            return text || '—';
        }

        function createStatusBadge(info) {
            const isActive = info.isActive === true;
            const isOnline = info.isOnline === true;
            const error = info.error;

            if (error) {
                let displayError = error;
                if (error.includes('timed out') || error.includes('порт 445')) displayError = 'Оффлайн';
                else if (error.includes('Не активен в SCCM')) displayError = 'Не активен в SCCM';
                return `<span class="badge-status badge-error">❌ ${escapeHtml(displayError)}</span>`;
            }
            if (!isActive) {
                return '<span class="badge-status badge-offline">✗ Не активен в SCCM</span>';
            }
            if (!isOnline) {
                return '<span class="badge-status badge-offline">○ Оффлайн</span>';
            }
            return '<span class="badge-status badge-active">✓ Активен</span> <span class="badge-status badge-online">● Онлайн</span>';
        }

        function updateRow(row, info) {
            try {
                row.cells[1].innerHTML = createStatusBadge(info);
                row.cells[2].textContent = safeText(info.hddTotal);
                row.cells[3].textContent = safeText(info.hddFree);
                row.cells[4].textContent = safeText(info.ram);
                row.cells[5].textContent = safeText(info.osInfo);

                row.classList.remove('offline', 'error-row');
                if (info.error) row.classList.add('error-row');
                else if (!info.isActive || !info.isOnline) row.classList.add('offline');
            } catch (err) {
                console.error('Error updating row:', err);
            }
        }

        // Явное завершение batch-сессии
        function endBatch() {
            if (!batchCorrelationId) return;
            const id = batchCorrelationId;
            batchCorrelationId = null;
            // fire-and-forget — не блокируем UI
            fetch('/api/ad/batch-end', {
                method: 'POST',
                headers: { 'X-Correlation-Id': id },
                keepalive: true
            }).catch(() => { });
        }

        async function loadHosts() {
            if (abortController) abortController.abort();
            abortController = new AbortController();
            const signal = abortController.signal;

            const tbody = document.getElementById('hostsTableBody');
            const progInd = document.getElementById('progressIndicator');
            const progText = document.getElementById('progressText');
            const countBadge = document.getElementById('hostCountBadge');
            const searchInput = document.getElementById('searchInput');
            const exportBtn = document.getElementById('exportBtn');
            const containerNameSpan = document.getElementById('containerName');

            containerNameSpan.textContent = containerName || 'неизвестно';

            batchCorrelationId = crypto.randomUUID();

            try {
                const hostsResponse = await fetch(`/api/ad/hosts?dn=${encodeURIComponent(containerDn)}`, { signal });
                if (!hostsResponse.ok) {
                    throw new Error(`Ошибка загрузки списка: ${hostsResponse.status}`);
                }

                let hosts;
                try {
                    hosts = await hostsResponse.json();
                } catch (jsonErr) {
                    throw new Error('Сервер вернул некорректный JSON при получении списка хостов');
                }

                if (!Array.isArray(hosts) || hosts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">Нет хостов в контейнере</td></tr>';
                    countBadge.textContent = '0 хостов';
                    progInd.classList.add('hidden');
                    endBatch();
                    return;
                }

                const allHosts = hosts.map(h => ({ hostname: (h.name || h.Name || '').toUpperCase(), row: null }));
                const totalHosts = allHosts.length;
                countBadge.textContent = totalHosts + ' хостов';
                tbody.innerHTML = '';

                allHosts.forEach(h => {
                    const row = tbody.insertRow();
                    row.id = 'row-' + escapeHtml(h.hostname);
                    row.innerHTML = `
                                    <td>${escapeHtml(h.hostname)}</td>
                                    <td><span class="badge-status">⏳ Загрузка...</span></td>
                                    <td>—</td>
                                    <td>—</td>
                                    <td>—</td>
                                    <td>—</td>
                                `;
                    h.row = row;
                });

                progText.textContent = `Загрузка данных (0/${totalHosts})`;
                let loadedCount = 0;

                async function fetchHostInfo(host) {
                    try {
                        if (signal.aborted) return;

                        const headers = {
                            'X-Correlation-Id': batchCorrelationId,
                            'X-Hostname': containerName || 'unknown',
                            'X-Batch-Type': 'ContainerInfo'
                        };

                        const resp = await fetch(`/api/ad/host-info?hostname=${encodeURIComponent(host.hostname)}`, {
                            signal,
                            headers
                        });

                        if (!resp.ok) {
                            throw new Error(`HTTP ${resp.status}`);
                        }

                        let info;
                        try {
                            info = await resp.json();
                        } catch (jsonErr) {
                            throw new Error('Некорректный JSON от сервера');
                        }

                        if (!signal.aborted) updateRow(host.row, info);
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                        console.error(`Error loading info for ${host.hostname}:`, err);
                        if (!signal.aborted) {
                            updateRow(host.row, { error: err.message || 'Ошибка загрузки' });
                        }
                    } finally {
                        loadedCount++;
                        if (!signal.aborted) {
                            progText.textContent = `Загрузка данных (${loadedCount}/${totalHosts})`;
                        }
                    }
                }

                const concurrency = 5;
                const queue = [...allHosts];

                async function worker() {
                    while (queue.length && !signal.aborted) {
                        const host = queue.shift();
                        await fetchHostInfo(host);
                    }
                }

                const workers = Array(Math.min(concurrency, queue.length)).fill().map(() => worker());
                await Promise.all(workers);

                if (!signal.aborted) {
                    progText.textContent = '✅ Загрузка завершена';
                    setTimeout(() => progInd.classList.add('hidden'), 1500);
                    searchInput.disabled = false;
                    exportBtn.disabled = false;
                    searchInput.addEventListener('input', filterTable);
                    exportBtn.addEventListener('click', exportToExcel);
                    isDataLoaded = true;
                }
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error('Fatal error in loadHosts:', err);
                tbody.innerHTML = `<tr><td colspan="6">Ошибка: ${escapeHtml(err.message)}</td></tr>`;
                progInd.classList.add('hidden');
            } finally {
                // Всегда закрываем batch после завершения загрузки
                endBatch();
            }
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const rows = document.querySelectorAll('#hostsTable tbody tr');
            rows.forEach(row => {
                let rowText = '';
                for (let cell of row.cells) {
                    rowText += (cell.textContent || '').toLowerCase() + ' ';
                }
                row.style.display = (query === '' || rowText.includes(query)) ? '' : 'none';
            });
        }

        function exportToExcel() {
            try {
                const rows = Array.from(document.querySelectorAll('#hostsTable tbody tr')).filter(row => row.style.display !== 'none');
                const headers = ['Hostname', 'Статус и информация', 'HDD Total', 'HDD Free', 'RAM', 'OS Info'];
                const data = [headers];

                rows.forEach(row => {
                    const rowData = [];
                    for (let cell of row.cells) {
                        let cellText = cell.textContent.trim();
                        if (cellText === '⏳ Загрузка...') cellText = '—';
                        rowData.push(cellText);
                    }
                    data.push(rowData);
                });

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Container Hosts');
                XLSX.writeFile(wb, `container_${containerName.replace(/[^a-z0-9]/gi, '_')}.xlsx`);
            } catch (err) {
                console.error('Export error:', err);
                alert('Ошибка экспорта: ' + err.message);
            }
        }

        window.addEventListener('beforeunload', () => {
            endBatch();
            if (abortController) abortController.abort();
        });

        loadHosts();
    </script>
</body>
</html>
