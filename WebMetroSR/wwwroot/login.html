<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Переопределяем фон для страницы входа */
        body.login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 48px 40px 40px;
            width: 400px;
            max-width: 94%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .login-logo .icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 64px;
                height: 64px;
                background: linear-gradient(135deg, #3b82f6, #2563eb);
                border-radius: 18px;
                font-size: 32px;
                color: white;
                box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
                margin-bottom: 12px;
            }

            .login-logo h2 {
                margin: 0;
                font-size: 24px;
                font-weight: 600;
                color: #f1f5f9;
                letter-spacing: -0.3px;
            }

            .login-logo p {
                margin: 4px 0 0;
                color: #94a3b8;
                font-size: 14px;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                color: #cbd5e1;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 0.2px;
            }

        .input-wrapper {
            position: relative;
        }

            .input-wrapper .input-icon {
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                color: #64748b;
                font-size: 16px;
                pointer-events: none;
            }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

            .form-group input::placeholder {
                color: #64748b;
                font-weight: 300;
            }

            .form-group input:focus {
                border-color: #3b82f6;
                background: rgba(255, 255, 255, 0.08);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            }

            .form-group input:-webkit-autofill {
                -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
                -webkit-text-fill-color: #f1f5f9 !important;
            }

        .login-container button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
            letter-spacing: 0.2px;
            font-family: inherit;
        }

            .login-container button:hover {
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                transform: translateY(-1px);
                box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
            }

            .login-container button:active {
                transform: translateY(0);
                box-shadow: none;
            }

            .login-container button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

        #loginError {
            margin-top: 16px;
            text-align: center;
            color: #f87171;
            font-size: 14px;
            font-weight: 500;
            display: none;
            padding: 8px 12px;
            background: rgba(248, 113, 113, 0.08);
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }

            .login-footer span {
                opacity: 0.6;
            }

        /* Адаптивность */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px 28px;
            }

            .login-logo .icon {
                width: 52px;
                height: 52px;
                font-size: 26px;
            }

            .login-logo h2 {
                font-size: 20px;
            }

            .form-group input {
                padding: 10px 14px 10px 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">
            <div class="icon">🔐</div>
            <h2>Вход в Metro SRH</h2>
            <p>Авторизуйтесь для доступа</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginInput">Логин</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="loginInput" placeholder="Введите ваш логин" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="passwordInput">Пароль</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="passwordInput" placeholder="Введите пароль" required>
                </div>
            </div>
            <button type="submit" id="loginBtn">Войти</button>
            <div id="loginError"></div>
        </form>

        <div class="login-footer">
            <span>Внутренняя система • &nbsp;Metro SRH</span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Вход...';
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            try {
                const formData = new FormData();
                formData.append('login', login);
                formData.append('password', password);

                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    window.location.href = '/Index.html';
                } else {
                    errorDiv.textContent = data.error || 'Неверный логин или пароль';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.textContent = 'Ошибка сети: ' + err.message;
                errorDiv.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
