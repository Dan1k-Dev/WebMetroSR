# SonarCloud configuration
sonar.projectKey=WebMetroSR
sonar.organization=dan1k-dev  

# Исходники в корне проекта
sonar.sources=.

# Исключаем временные папки и сгенерированные файлы
sonar.exclusions=**/bin/**, **/obj/**, **/wwwroot/lib/**, **/*.min.js, **/*.min.css, **/*.deps.json, **/*.runtimeconfig.json, **/*.cache, **/*.generated.json

# Исключаем из истории изменений 
sonar.scm.exclusions=**/bin/**, **/obj/**

# Явно включаем только нужные файлы 
sonar.inclusions=**/*.cs, **/*.js, **/*.html, **/*.css, **/*.ts